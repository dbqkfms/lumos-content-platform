name: 루모스 원본보존 설치·코드 검증
on:
  push:
    branches: [work/lumos-site-edit-20260922]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: lumos-edit-verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.ref == 'refs/heads/work/lumos-site-edit-20260922'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      LUMOS_QA_DIR: .qa
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.16.0
      - name: 원본과 변경 범위 검사
        run: |
          mkdir -p .qa
          python3 scripts/verify-preservation.py | tee .qa/preservation.log
          node --version > .qa/node-version.txt
          npm --version > .qa/npm-version.txt
          sha256sum package-lock.json > .qa/lockfile.sha256
      - name: 기존 잠금파일로 깨끗한 설치
        run: npm ci --legacy-peer-deps --no-audit --no-fund 2>&1 | tee .qa/install.log
      - name: 타입·회귀·전체 빌드 검사
        shell: bash
        run: |
          set +e
          npm run check > .qa/typecheck.log 2>&1
          types=$?
          node tests/catalogue-resilience.cjs > .qa/unit.log 2>&1
          units=$?
          npm run build > .qa/build.log 2>&1
          build=$?
          printf 'typecheck=%s\nunit=%s\nbuild=%s\n' "$types" "$units" "$build" | tee .qa/exit-codes.txt
          tail -n 30 .qa/typecheck.log .qa/unit.log .qa/build.log
          test "$types" -eq 0 && test "$units" -eq 0 && test "$build" -eq 0
      - name: 검사 결과만 보관
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lumos-edit-verification-${{ github.sha }}
          path: .qa/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
